name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOWORK: off

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Run unit tests with coverage
        run: go test ./... -count=1 -parallel=$(nproc) -timeout=60s -coverprofile=coverage.out
      - name: Enforce coverage threshold
        env:
          COVERAGE_MIN: "75"
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/,"",$NF); print $NF}')
          echo "Total coverage: ${total}% (minimum ${COVERAGE_MIN}%)"
          awk -v t="$total" -v m="$COVERAGE_MIN" 'BEGIN { exit (t+0 < m+0) ? 1 : 0 }'
      - name: Summarize coverage
        if: always()
        run: go tool cover -func=coverage.out

  race:
    name: Race detector
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Run tests with race detector
        run: go test -race ./... -count=1 -parallel=$(nproc) -timeout=90s

  static:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Check gofmt
        run: test -z "$(gofmt -l .)"
      - name: Run go vet
        run: go vet ./...
      - name: Build examples
        run: go build -o /dev/null ./examples/...

  lint:
    name: Lint and vulncheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --timeout=3m
          skip-cache: false

  bench:
    name: Critical benchmarks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Run critical benchmarks
        run: |
          go test -bench='BenchmarkCodecComparison|BenchmarkPublishJSON|BenchmarkPublishBytes|BenchmarkPublishAsyncBytes|BenchmarkWorkerPool' \
            -benchmem -count=1 -benchtime=100ms -run '^$' \
            ./ ./workerpool/ | tee bench/ci-run.txt
      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v5
        with:
          name: bench-ci-run
          path: bench/ci-run.txt
      - name: Compare benchmarks to baseline
        continue-on-error: true
        run: |
          go install golang.org/x/perf/cmd/benchstat@latest
          if [ -f bench/baseline.txt ]; then
            benchstat bench/baseline.txt bench/ci-run.txt || true
          else
            echo "No bench/baseline.txt committed; skip comparison"
          fi

  fuzz:
    name: Fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Run fuzz smoke tests
        run: |
          for fuzz in FuzzDecodeJSON FuzzCommonWildcardSubject FuzzShardIndex; do
            go test -fuzz="$fuzz" -fuzztime=5s . -run '^$'
          done
