name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOWORK: off

jobs:
  test:
    name: Test and lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Download modules
        run: go mod download
      - name: Check gofmt
        run: test -z "$(gofmt -l .)"
      - name: Run go vet
        run: go vet ./...
      - name: Run unit tests with coverage
        run: |
          set -euo pipefail
          mapfile -t pkgs < <(go list ./... | grep -vE '/(examples|tools)/')
          go test "${pkgs[@]}" -count=1 -parallel=$(nproc) -timeout=60s -coverprofile=coverage.out
      - name: Enforce coverage threshold
        env:
          COVERAGE_MIN: "75"
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/,"",$NF); print $NF}')
          echo "Total coverage: ${total}% (minimum ${COVERAGE_MIN}%)"
          awk -v t="$total" -v m="$COVERAGE_MIN" 'BEGIN { exit (t+0 < m+0) ? 1 : 0 }'
      - name: Build examples
        run: go build -o /dev/null ./examples/...
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --timeout=3m
          skip-cache: false
          skip-save-cache: ${{ github.ref != 'refs/heads/main' }}

  race:
    name: Race detector
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Download modules
        run: go mod download
      - name: Run tests with race detector
        run: |
          set -euo pipefail
          mapfile -t pkgs < <(go list ./... | grep -vE '/(examples|tools)/')
          go test -race "${pkgs[@]}" -count=1 -parallel=4 -timeout=120s

  bench:
    name: Critical benchmarks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Download modules
        run: go mod download
      - name: Run critical benchmarks
        run: |
          go test -bench='BenchmarkCodecComparison|BenchmarkPublishJSON|BenchmarkPublishBytes|BenchmarkPublishAsyncBytes|BenchmarkWorkerPool' \
            -benchmem -count=1 -benchtime=100ms -run '^$' \
            ./ ./workerpool/

  fuzz:
    name: Fuzz smoke
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Download modules
        run: go mod download
      - name: Run fuzz smoke tests
        run: |
          set -euo pipefail
          for fuzz in FuzzDecodeJSON FuzzCommonWildcardSubject FuzzShardIndex; do
            go test -fuzz="$fuzz" -fuzztime=2s -fuzzminimizetime=0 -timeout=5m . -run '^$'
          done

  vuln:
    name: Vulnerability scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Cache govulncheck
        id: govulncheck-cache
        uses: actions/cache@v4
        with:
          path: ~/go/bin/govulncheck
          key: govulncheck-v1.6.0-${{ runner.os }}-${{ hashFiles('go.mod') }}
          restore-keys: |
            govulncheck-v1.6.0-${{ runner.os }}-
      - name: Install govulncheck
        if: steps.govulncheck-cache.outputs.cache-hit != 'true'
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
      - name: Add Go bin to PATH
        run: echo "$HOME/go/bin" >> "$GITHUB_PATH"
      - name: Run govulncheck
        run: govulncheck ./...
