name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOWORK: off

jobs:
  test:
    name: Test and lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Download modules
        run: go mod download
      - name: Check go.mod tidy
        run: |
          set -euo pipefail
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Check gofmt
        run: test -z "$(gofmt -l .)"
      - name: Run go vet
        run: go vet ./...
      - name: Run unit tests with coverage
        run: |
          set -euo pipefail
          mapfile -t pkgs < <(go list ./... | grep -vE '/(examples|tools)/')
          go test "${pkgs[@]}" -count=1 -parallel=$(nproc) -timeout=60s -coverprofile=coverage.out
      - name: Enforce coverage threshold
        env:
          COVERAGE_MIN: "75"
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/,"",$NF); print $NF}')
          echo "Total coverage: ${total}% (minimum ${COVERAGE_MIN}%)"
          awk -v t="$total" -v m="$COVERAGE_MIN" 'BEGIN { exit (t+0 < m+0) ? 1 : 0 }'
      - name: Build examples
        run: go build -o /dev/null ./examples/...
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          args: --timeout=3m
          skip-cache: false
          skip-save-cache: ${{ github.ref != 'refs/heads/main' }}
      - name: Cache goalign
        id: goalign-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin/goalign
          key: goalign-v1.1.0-${{ runner.os }}
      - name: Install goalign
        if: steps.goalign-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          ver=v1.1.0
          mkdir -p "${HOME}/go/bin"
          curl -fsSL "https://github.com/gopherust-io/goalign/archive/refs/tags/${ver}.tar.gz" | tar -xz -C /tmp
          (cd "/tmp/goalign-${ver#v}" && go build -o "${HOME}/go/bin/goalign" .)
      - name: Run goalign
        run: |
          echo "${HOME}/go/bin" >> "${GITHUB_PATH}"
          goalign analyze -r --arch=amd64 --fail-on-findings --min-waste=1 -e examples/,tools/ .

  race:
    name: Race detector
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Download modules
        run: go mod download
      - name: Run tests with race detector
        run: |
          set -euo pipefail
          mapfile -t pkgs < <(go list ./... | grep -vE '/(examples|tools)/')
          go test -race "${pkgs[@]}" -count=1 -parallel=4 -timeout=120s

  bench:
    name: Critical benchmarks
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Download modules
        run: go mod download
      - name: Run critical benchmarks
        run: |
          go test -bench='BenchmarkCodecComparison|BenchmarkPublishJSON|BenchmarkPublishBytes|BenchmarkPublishAsyncBytes|BenchmarkWorkerPool' \
            -benchmem -count=1 -benchtime=100ms -run '^$' \
            ./ ./workerpool/

  fuzz:
    name: Fuzz smoke
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Download modules
        run: go mod download
      - name: Run fuzz smoke tests
        run: |
          set -euo pipefail
          for fuzz in FuzzDecodeJSON FuzzCommonWildcardSubject FuzzShardIndex; do
            go test -fuzz="$fuzz" -fuzztime=2s -fuzzminimizetime=0 -timeout=5m . -run '^$'
          done

  vuln:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Cache govulncheck
        id: govulncheck-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin/govulncheck
          key: govulncheck-v1.6.0-${{ runner.os }}-${{ hashFiles('go.mod') }}
          restore-keys: |
            govulncheck-v1.6.0-${{ runner.os }}-
      - name: Install govulncheck
        if: steps.govulncheck-cache.outputs.cache-hit != 'true'
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
      - name: Add Go bin to PATH
        run: echo "$HOME/go/bin" >> "$GITHUB_PATH"
      - name: Run govulncheck
        run: govulncheck ./...
