# Mini supercluster: 2 clusters × 2 nodes (east / west) linked by gateways.
#
#   docker compose -f docker/nats/supercluster/docker-compose.yml up -d
#   East client: nats://127.0.0.1:4222,nats://127.0.0.1:4223
#   West client: nats://127.0.0.1:4225,nats://127.0.0.1:4226
#
# Do not run alongside docker/nats/cluster (port overlap on 4222/4223).

services:
  nats-east-1:
    image: nats:2.14
    container_name: nats-east-1
    command: ["-c", "/etc/nats/nats.conf"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - ./cluster-a/n1.conf:/etc/nats/nats.conf:ro
      - js-east-1:/data
    networks:
      - nats-super
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  nats-east-2:
    image: nats:2.14
    container_name: nats-east-2
    command: ["-c", "/etc/nats/nats.conf"]
    ports:
      - "4223:4222"
      - "8223:8222"
    volumes:
      - ./cluster-a/n2.conf:/etc/nats/nats.conf:ro
      - js-east-2:/data
    networks:
      - nats-super
    depends_on:
      nats-east-1:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  nats-west-1:
    image: nats:2.14
    container_name: nats-west-1
    command: ["-c", "/etc/nats/nats.conf"]
    ports:
      - "4225:4222"
      - "8225:8222"
    volumes:
      - ./cluster-b/n1.conf:/etc/nats/nats.conf:ro
      - js-west-1:/data
    networks:
      - nats-super
    depends_on:
      nats-east-1:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  nats-west-2:
    image: nats:2.14
    container_name: nats-west-2
    command: ["-c", "/etc/nats/nats.conf"]
    ports:
      - "4226:4222"
      - "8226:8222"
    volumes:
      - ./cluster-b/n2.conf:/etc/nats/nats.conf:ro
      - js-west-2:/data
    networks:
      - nats-super
    depends_on:
      nats-west-1:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    restart: unless-stopped

networks:
  nats-super:
    name: nats-super

volumes:
  js-east-1:
  js-east-2:
  js-west-1:
  js-west-2:
