# East cluster node 2 — JetStream domain "east", gateway to west.
# Not for production (no TLS / auth).

server_name: nats-east-2

listen: 0.0.0.0:4222
http: 0.0.0.0:8222

jetstream {
  store_dir: /data
  domain: east
  max_mem_store: 256M
  max_file_store: 2G
}

cluster {
  name: east
  listen: 0.0.0.0:6222
  routes: [
    nats://nats-east-1:6222
    nats://nats-east-2:6222
  ]
}

gateway {
  name: east
  listen: 0.0.0.0:7222
  gateways: [
    { name: west, urls: [nats://nats-west-1:7222, nats://nats-west-2:7222] }
  ]
}
