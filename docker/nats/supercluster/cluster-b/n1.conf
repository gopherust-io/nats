# West cluster node 1 — JetStream domain "west", gateway to east.
# Not for production (no TLS / auth).

server_name: nats-west-1

listen: 0.0.0.0:4222
http: 0.0.0.0:8222

jetstream {
  store_dir: /data
  domain: west
  max_mem_store: 256M
  max_file_store: 2G
}

cluster {
  name: west
  listen: 0.0.0.0:6222
  routes: [
    nats://nats-west-1:6222
    nats://nats-west-2:6222
  ]
}

gateway {
  name: west
  listen: 0.0.0.0:7222
  gateways: [
    { name: east, urls: [nats://nats-east-1:7222, nats://nats-east-2:7222] }
  ]
}
