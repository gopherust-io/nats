# Cluster node 3 — JetStream domain "hub".
# Not for production (no TLS / auth).

server_name: nats-3

listen: 0.0.0.0:4222
http: 0.0.0.0:8222

jetstream {
  store_dir: /data
  domain: hub
  max_mem_store: 512M
  max_file_store: 5G
}

cluster {
  name: c1
  listen: 0.0.0.0:6222
  routes: [
    nats://nats-1:6222
    nats://nats-2:6222
    nats://nats-3:6222
  ]
}
