# Local auth lab — not for production (no TLS).
# Users: orders-pub / orders-worker / js-admin (see README.md).

server_name: nats-auth

listen: 0.0.0.0:4222
http: 0.0.0.0:8222

jetstream {
  store_dir: /data
  max_mem_store: 512M
  max_file_store: 2G
}

accounts {
  APP: {
    jetstream: enabled
    users: [
      {
        user: orders-pub
        password: pubpass
        permissions: {
          publish: [ "orders.>" ]
          subscribe: [ "_INBOX.>" ]
        }
      }
      {
        user: orders-worker
        password: workerpass
        permissions: {
          publish: [
            "$JS.API.CONSUMER.>"
            "$JS.ACK.>"
            "$JS.FC.>"
          ]
          subscribe: [
            "orders.>"
            "_INBOX.>"
          ]
        }
      }
      {
        user: js-admin
        password: adminpass
        permissions: {
          publish: [ ">", "$JS.API.>" ]
          subscribe: [ ">", "_INBOX.>", "$JS.API.>" ]
        }
      }
    ]
  }
}
